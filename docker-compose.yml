services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cloudwatch_insights
      POSTGRES_PASSWORD: cloudwatch_insights
      POSTGRES_DB: cloudwatch_insights
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudwatch_insights"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://cloudwatch_insights:cloudwatch_insights@postgres:5432/cloudwatch_insights
      # The backend needs its own ambient AWS identity to assume roles into
      # target accounts -- forward it from the host environment (see README).
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_PROFILE: ${AWS_PROFILE:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      # Optional: the AI assistant (Logs page) stays hidden in the UI unless
      # all three of these are set. Forwarded from the host the same way as
      # the AWS_* vars above.
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-}
      LITELLM_MODEL: ${LITELLM_MODEL:-}
      # Password for the "admin" user created on first startup. Leave unset
      # and the backend generates one itself, logged once here in `docker
      # compose logs backend` -- set it explicitly if you'd rather choose it.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Local dev is plain HTTP, so the session cookie can't use `Secure`
      # (browsers won't store it) -- keep this false here; deployments should
      # leave it at the backend's default (true) once served over HTTPS.
      COOKIE_SECURE: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      BACKEND_SERVICE_HOST: backend
      BACKEND_SERVICE_PORT: "8000"
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  postgres-data:
