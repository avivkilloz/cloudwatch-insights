name: build-iot-ota-jobs
about: >-
  The user's OTA conversation (D145-D153): an IoT jobs pane with each job's execution counts as columns and rows
  that open onto the job's detail. A real model kept ListJobs as a request and added an "export with details"
  action (which can't add columns), read `row.jobId` from rows whose column is `Job ID`, read `d.job_id` from a
  reply that keeps it at `d.job.jobId`, and every round of "fix it" made it worse. What reaches the editor must
  check clean, list in code (a call per job for its counts), open rows through a row action -- and, tried on the
  fake environment, show its counts and open onto filled fields.
build:
  kind: pane
  source: ""
  title: New pane type
  try_on: "{env}"
aws:
  - service: iot
    operation: ListJobs
    reply:
      jobs:
        - {jobId: ota-fw-2-1, status: IN_PROGRESS, createdAt: "2026-10-20T08:00:00+00:00"}
        - {jobId: ota-fw-2-0, status: IN_PROGRESS, createdAt: "2026-10-18T08:00:00+00:00"}
  - service: iot
    operation: DescribeJob
    reply:
      job:
        jobId: ota-fw-2-1
        status: IN_PROGRESS
        description: Firmware 2.1 for the pool robots
        targets: ["arn:aws:iot:eu-west-1:000000000001:thinggroup/fleet"]
        jobProcessDetails: {numberOfQueuedThings: 12, numberOfInProgressThings: 3, numberOfSucceededThings: 40,
                            numberOfFailedThings: 2, numberOfTimedOutThings: 0}
  - service: iot
    operation: GetJobDocument
    reply: {document: '{"operation": "ota", "version": "2.1", "url": "s3://firmware/2.1.bin"}'}
  - service: iot
    operation: ListJobExecutionsForJob
    reply:
      executionSummaries:
        - thingArn: "arn:aws:iot:eu-west-1:000000000001:thing/pool-7"
          jobExecutionSummary: {status: SUCCEEDED, lastUpdatedAt: "2026-10-20T09:00:00+00:00"}
        - thingArn: "arn:aws:iot:eu-west-1:000000000001:thing/pool-9"
          jobExecutionSummary: {status: FAILED, lastUpdatedAt: "2026-10-20T09:05:00+00:00"}
messages:
  - >-
    create an IoT OTA jobs pane: list the jobs in the chosen environments with, for each job, how many executions
    are queued, in progress, succeeded, failed and timed out as columns of the table (so the CSV export has them
    too). Expanding a job should show its description, targets, its job document and the list of its executions
    with each thing's status.
expect:
  - proposed:
      checks: true
      contains: ["DescribeJob", "expand:", "detail:", "args:"]
  - tried: true
