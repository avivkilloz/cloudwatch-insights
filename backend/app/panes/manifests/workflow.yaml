id: workflow
label: Workflow
order: 300
group: Platform
category: Platform
# No flag (D65): granted to no group until an admin ticks it -- and a run
# still needs the workflow's own grant (D84).
about: >-
  Runs a workflow from inside a session: pick one, fill in its parameters, and Run. The run is the same
  as one started on the Workflows page -- as you, recorded there -- and the pane follows it: a summary and each stage's
  status as it goes.
description: Run a workflow from a session and follow it here.
help: >-
  Pick a workflow, fill in its parameters -- the same fields as the Workflows page's Run, an environment picked by
  name, choices listed where the workflow lists them -- and Run. It runs as you; Cancel run stops it. The whole run,
  its outputs and files are on the Workflows page.
state: v2
rendered: true
inputs:
  - key: workflow
    type: text
    label: Workflow
    default: ""
    help: The workflow to run (list_options lists the ones the user may run).
    options:
      action: list_workflows
      placeholder: Choose a workflow…
    # Another workflow's parameters aren't this one's.
    resets: [in.params, out.summary, out.stages, out.runLink]
  - key: params
    type: workflow_params
    of: workflow
    label: Parameters
    default: {}
    help: >-
      The workflow's parameters: key -> value (list_workflows lists them). A connection by its name or id; a list as a
      list, or comma-separated.
actions:
  - id: list_workflows
    handler: platform.workflows.list
  - id: run
    main: true
    handler: platform.workflows.start
    run_label: Run
    busy_label: Running…
    stop_label: Cancel run
    requires: { workflow: Choose a workflow first. }
    resets: [out.summary, out.stages, out.runLink]
    poll:
      handler: platform.workflows.poll
      stop: platform.workflows.cancel
      every: 2
outputs:
  - key: summary
    render: text
  - key: stages
    render: table
    actions: [copy, export, attach]
  - key: runLink
    render: link
  - key: run
    render: run
layout:
  - title: Workflow
    items:
      - input: workflow
      - input: params
      - toolbar:
          - action: run
          - stop: run
          - output: run
  - title: Run
    when: { output: summary, present: true }
    items:
      - output: summary
      - output: runLink
      - output: stages
agent:
  run: Starts the workflow as the user with these parameters and follows it in the pane; you get its summary and stages.
