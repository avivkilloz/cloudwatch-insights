id: logs-cloudwatch
label: CloudWatch
order: 10
group: Services
flag: logs_enabled
about: >-
  CloudWatch Logs Insights: one query across log groups in several environments, results merged newest first.
description: >-
  Query CloudWatch Logs Insights across environments.
help: >-
  Run one CloudWatch Logs Insights query across several AWS accounts and regions at once and read the merged results
  newest-first. Pick the environments and log groups, write the query in Insights' pipe syntax or have the agent
  write it, then run it.
state: v2
rendered: true
inputs:
  - key: connections
    type: connections
    connection_type: aws
    legacy_key: selectedEnvironmentIds
    default: []
    help: Which environments to search.
  - key: logGroupSelection
    type: log_groups
    default: {}
    help: >-
      Which log groups to query, per environment (list_log_groups gives the names). Their environments are selected
      with them.
    options:
      action: list_log_groups
      load_label: Load log groups
      busy_label: Loading log groups…
      placeholder: Select environments above, then load log groups.
      filter: Filter log groups…
  - key: queryString
    type: text
    rows: 5
    default: "fields @timestamp, @log, @message\n| sort @timestamp desc"
    help: The Logs Insights query, in its pipe syntax.
  - key: limit
    type: int
    label: Limit
    default: 100
    min: 1
    max: 10000
    width: 90
    help: Max rows per environment (also applied to the merged, most-recent-first total)
  - key: preset
    type: choice
    default: 900
    help: How far back to search, in seconds, or "custom" to use customStart/customEnd.
    choices: [300, 900, 1800, 3600, 10800, 21600, 43200, 86400, 259200, 604800, custom]
    choice_labels:
      "300": Last 5 minutes
      "900": Last 15 minutes
      "1800": Last 30 minutes
      "3600": Last 1 hour
      "10800": Last 3 hours
      "21600": Last 6 hours
      "43200": Last 12 hours
      "86400": Last 1 day
      "259200": Last 3 days
      "604800": Last 7 days
      custom: Custom range…
  - key: customStart
    type: text
    default: ""
    help: 'Start of a custom range, in the user''s local time: "YYYY-MM-DDTHH:mm".'
  - key: customEnd
    type: text
    default: ""
    help: 'End of a custom range, in the user''s local time: "YYYY-MM-DDTHH:mm".'
actions:
  - id: list_log_groups
    handler: aws.logs.list_log_groups
    requires: { connections: "Select environments above, then load log groups." }
  - id: run
    handler: aws.cloudwatch.start
    main: true
    run_label: Run query
    busy_label: Running…
    poll: { handler: aws.cloudwatch.poll, stop: aws.cloudwatch.stop }
    requires: { logGroupSelection: Select at least one log group to query. }
    resets: [view.expanded]
outputs:
  - key: results
    render: logs
    legacy_key: results
    actions: [select, export, attach]
    config: &logs
      groups: { rows: rows, name: environment_name, error: error, as: environment, fields: true }
      domain: logs-cloudwatch
      export: logs-results
      limit: limit
      sort: { field: sortField, direction: sortDirection }
      group_by: groupBy
      expand: expanded
  - key: run
    render: run
views:
  - key: sortField
    default: "@timestamp"
    legacy_key: sortField
  - key: sortDirection
    default: desc
    legacy_key: sortDirection
  - key: groupBy
    default: none
  - key: expanded
    default: []
legacy_drop: [osResults, timestampField, openSearchSelection, startedQueries]
layout:
  - title: 1. Choose environments
    items:
      - input: connections
  - title: 2. Choose log groups
    items:
      - input: logGroupSelection
  - title: 3. Query
    items:
      - toolbar:
          - time_range: { preset: preset, start: customStart, end: customEnd }
          - input: limit
          - sort: results
      - input: queryString
      - toolbar:
          - action: run
          - stop: run
          - output: run
  - title: 4. Results
    items:
      - restored: run
      - output: results
implies: log_group_environments
inspect:
  help: Shows one row of the last run with all its fields.
agent:
  run: >-
    Runs the query and shows the rows in the pane as they arrive; you get the row counts and a sample. A query still
    running after about 90 seconds keeps running in the pane; stop_pane stops it.
