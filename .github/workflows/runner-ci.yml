name: Runner CI

on:
  push:
    branches: ["**"]
    paths:
      - "runner/**"
      - ".github/workflows/runner-ci.yml"
  pull_request:
    paths:
      - "runner/**"
      - ".github/workflows/runner-ci.yml"
  workflow_dispatch: {}

defaults:
  run:
    working-directory: runner

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: runner/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v

      # As root too: that's how the image runs, and only then does each job
      # drop to a uid of its own (the isolation tests skip otherwise). From a
      # copy every uid can read, as the image's /app is: the checkout sits
      # under a home a slot's uid may not enter.
      - name: Run tests as root
        run: |
          sudo cp -r . /opt/runner-test && sudo chmod -R a+rX,go-w /opt/runner-test
          cd /opt/runner-test && sudo -E "$(which python)" -m pytest tests/ -v -p no:cacheprovider

  build-image:
    needs: test
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-runner" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
