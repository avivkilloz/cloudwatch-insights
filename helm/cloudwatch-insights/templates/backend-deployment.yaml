{{- if and (not .Values.backend.database.existingSecret) (not .Values.backend.database.host) }}
{{- fail "Set backend.database.existingSecret (a Secret with a DATABASE_URL key) or backend.database.host (plus user/name/passwordSecret) so the backend can reach Postgres." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloudwatch-insights.backend.fullname" . }}
  labels:
    {{- include "cloudwatch-insights.backend.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "cloudwatch-insights.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cloudwatch-insights.backend.selectorLabels" . | nindent 8 }}
      {{- with .Values.backend.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "cloudwatch-insights.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: AWS_REGION
              value: {{ .Values.backend.awsRegion | quote }}
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.backend.awsRegion | quote }}
            {{- if .Values.backend.database.existingSecret }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.database.existingSecret }}
                  key: {{ .Values.backend.database.existingSecretKey }}
            {{- else }}
            - name: POSTGRES_HOST
              value: {{ .Values.backend.database.host | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.backend.database.port | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.backend.database.name | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.backend.database.user | quote }}
            {{- if .Values.backend.database.sslMode }}
            - name: POSTGRES_SSLMODE
              value: {{ .Values.backend.database.sslMode | quote }}
            {{- end }}
            - name: POSTGRES_PASSWORD
              {{- if .Values.backend.database.passwordSecret.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.database.passwordSecret.name }}
                  key: {{ .Values.backend.database.passwordSecret.key }}
              {{- else }}
              value: {{ .Values.backend.database.password | quote }}
              {{- end }}
            {{- end }}
            {{- if .Values.agent.enabled }}
            # Where the backend relays chat turns (/api/agent/chat).
            - name: AGENT_URL
              value: "http://{{ include "cloudwatch-insights.agent.fullname" . }}:{{ .Values.agent.service.port }}"
            {{- if .Values.agent.builder.deployment.enabled }}
            # Where turns beside an editor go: the Builder's own agent (D116).
            - name: AGENT_BUILDER_URL
              value: "http://{{ include "cloudwatch-insights.builder.fullname" . }}:{{ .Values.agent.service.port }}"
            {{- end }}
            {{- if .Values.agent.serviceKey.existingSecret }}
            - name: AGENT_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.agent.serviceKey.existingSecret }}
                  key: {{ .Values.agent.serviceKey.existingSecretKey }}
            {{- end }}
            {{- end }}
            {{- if .Values.runner.enabled }}
            # Where code runs (PLATFORM_PLAN.md §25), and how its jobs call back.
            - name: RUNNER_URL
              value: "http://{{ include "cloudwatch-insights.runner.fullname" . }}:{{ .Values.runner.service.port }}"
            - name: RUNNER_CALLBACK_URL
              value: "http://{{ include "cloudwatch-insights.backend.fullname" . }}:{{ .Values.backend.service.port }}"
            - name: RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runner.token.existingSecret }}
                  key: {{ .Values.runner.token.existingSecretKey }}
            {{- end }}
            - name: COOKIE_SECURE
              value: {{ .Values.backend.auth.cookieSecure | quote }}
            {{- if or .Values.backend.auth.existingSecret .Values.backend.auth.adminPassword }}
            - name: ADMIN_PASSWORD
              {{- if .Values.backend.auth.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.auth.existingSecret }}
                  key: {{ .Values.backend.auth.existingSecretKey }}
              {{- else }}
              value: {{ .Values.backend.auth.adminPassword | quote }}
              {{- end }}
            {{- end }}
            {{- if .Values.backend.masterKey.existingSecret }}
            - name: PLATFORM_MASTER_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.masterKey.existingSecret }}
                  key: {{ .Values.backend.masterKey.existingSecretKey }}
            {{- if .Values.backend.masterKey.keyId }}
            - name: PLATFORM_MASTER_KEY_ID
              value: {{ .Values.backend.masterKey.keyId | quote }}
            {{- end }}
            {{- end }}
            # The store repo's clone lives here (an emptyDir: it's a cache,
            # re-made from the repo on every start).
            - name: STORE_WORKDIR
              value: /var/lib/platform-store
            {{- with .Values.backend.store.git }}
            {{- if .url }}
            {{- if not .namespace }}
            {{- fail "backend.store.git.namespace is required with backend.store.git.url: what's made in the platform is named <namespace>:<name>." }}
            {{- end }}
            - name: STORE_GIT_URL
              value: {{ .url | quote }}
            - name: STORE_GIT_BRANCH
              value: {{ .branch | default "main" | quote }}
            - name: STORE_GIT_PATH
              value: {{ .path | quote }}
            - name: STORE_NAMESPACE
              value: {{ .namespace | quote }}
            - name: STORE_AUTHOR_DOMAIN
              value: {{ .authorDomain | default "platform.local" | quote }}
            - name: STORE_GIT_USERNAME
              value: {{ .username | quote }}
            {{- if .existingSecret }}
            - name: STORE_GIT_SECRET_DIR
              value: /etc/platform-store
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.backend.storage }}
            - name: STORAGE_TYPE
              value: {{ .type | quote }}
            - name: STORAGE_RETENTION_DAYS
              value: {{ .retentionDays | quote }}
            {{- if eq .type "s3" }}
            {{- if not .s3.bucket }}
            {{- fail "backend.storage.s3.bucket is required with backend.storage.type s3." }}
            {{- end }}
            - name: STORAGE_S3_BUCKET
              value: {{ .s3.bucket | quote }}
            - name: STORAGE_S3_REGION
              value: {{ .s3.region | quote }}
            - name: STORAGE_S3_ENDPOINT
              value: {{ .s3.endpoint | quote }}
            - name: STORAGE_S3_PREFIX
              value: {{ .s3.prefix | quote }}
            {{- else if eq .type "filesystem" }}
            {{- if and .filesystem.persistence.enabled (eq .filesystem.persistence.accessMode "ReadWriteOnce") (gt (int $.Values.backend.replicaCount) 1) }}
            {{- fail "backend.storage.filesystem: a ReadWriteOnce volume attaches to one node, so more than one backend replica can't share it. Use ReadWriteMany (EFS, Filestore, NFS), s3, or one replica." }}
            {{- end }}
            - name: STORAGE_PATH
              value: {{ .filesystem.path | quote }}
            {{- else }}
            {{- fail "backend.storage.type is s3 or filesystem." }}
            {{- end }}
            {{- end }}
            {{- with .Values.backend.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.backend.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: store-work
              mountPath: /var/lib/platform-store
            {{- if eq .Values.backend.storage.type "filesystem" }}
            - name: files
              mountPath: {{ .Values.backend.storage.filesystem.path }}
            {{- end }}
            {{- if and .Values.backend.store.git.url .Values.backend.store.git.existingSecret }}
            - name: store-secret
              mountPath: /etc/platform-store
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      volumes:
        - name: store-work
          emptyDir: {}
        {{- if eq .Values.backend.storage.type "filesystem" }}
        - name: files
          {{- with .Values.backend.storage.filesystem.persistence }}
          {{- if .enabled }}
          persistentVolumeClaim:
            claimName: {{ .existingClaim | default (printf "%s-files" (include "cloudwatch-insights.backend.fullname" $)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
          {{- end }}
        {{- end }}
        {{- if and .Values.backend.store.git.url .Values.backend.store.git.existingSecret }}
        - name: store-secret
          secret:
            secretName: {{ .Values.backend.store.git.existingSecret }}
            # Read by the backend's own user (1000); the pod runs nothing else.
            defaultMode: 0444
        {{- end }}
