{{- if and (not .Values.backend.database.existingSecret) (not .Values.backend.database.host) }}
{{- fail "Set backend.database.existingSecret (a Secret with a DATABASE_URL key) or backend.database.host (plus user/name/passwordSecret) so the backend can reach Postgres." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloudwatch-insights.backend.fullname" . }}
  labels:
    {{- include "cloudwatch-insights.backend.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "cloudwatch-insights.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cloudwatch-insights.backend.selectorLabels" . | nindent 8 }}
      {{- with .Values.backend.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "cloudwatch-insights.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: AWS_REGION
              value: {{ .Values.backend.awsRegion | quote }}
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.backend.awsRegion | quote }}
            {{- if .Values.backend.database.existingSecret }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.database.existingSecret }}
                  key: {{ .Values.backend.database.existingSecretKey }}
            {{- else }}
            - name: POSTGRES_HOST
              value: {{ .Values.backend.database.host | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.backend.database.port | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.backend.database.name | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.backend.database.user | quote }}
            {{- if .Values.backend.database.sslMode }}
            - name: POSTGRES_SSLMODE
              value: {{ .Values.backend.database.sslMode | quote }}
            {{- end }}
            - name: POSTGRES_PASSWORD
              {{- if .Values.backend.database.passwordSecret.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.database.passwordSecret.name }}
                  key: {{ .Values.backend.database.passwordSecret.key }}
              {{- else }}
              value: {{ .Values.backend.database.password | quote }}
              {{- end }}
            {{- end }}
            {{- if .Values.agent.enabled }}
            # Where the backend relays chat turns (/api/agent/chat).
            - name: AGENT_URL
              value: "http://{{ include "cloudwatch-insights.agent.fullname" . }}:{{ .Values.agent.service.port }}"
            {{- if .Values.agent.serviceKey.existingSecret }}
            - name: AGENT_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.agent.serviceKey.existingSecret }}
                  key: {{ .Values.agent.serviceKey.existingSecretKey }}
            {{- end }}
            {{- end }}
            - name: COOKIE_SECURE
              value: {{ .Values.backend.auth.cookieSecure | quote }}
            {{- if or .Values.backend.auth.existingSecret .Values.backend.auth.adminPassword }}
            - name: ADMIN_PASSWORD
              {{- if .Values.backend.auth.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.auth.existingSecret }}
                  key: {{ .Values.backend.auth.existingSecretKey }}
              {{- else }}
              value: {{ .Values.backend.auth.adminPassword | quote }}
              {{- end }}
            {{- end }}
            {{- if .Values.backend.masterKey.existingSecret }}
            - name: PLATFORM_MASTER_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.masterKey.existingSecret }}
                  key: {{ .Values.backend.masterKey.existingSecretKey }}
            {{- if .Values.backend.masterKey.keyId }}
            - name: PLATFORM_MASTER_KEY_ID
              value: {{ .Values.backend.masterKey.keyId | quote }}
            {{- end }}
            {{- end }}
            # The store repo's clone lives here (an emptyDir: it's a cache,
            # re-made from the repo on every start).
            - name: STORE_WORKDIR
              value: /var/lib/platform-store
            {{- with .Values.backend.store.git }}
            {{- if .url }}
            {{- if not .namespace }}
            {{- fail "backend.store.git.namespace is required with backend.store.git.url: what's made in the platform is named <namespace>:<name>." }}
            {{- end }}
            - name: STORE_GIT_URL
              value: {{ .url | quote }}
            - name: STORE_GIT_BRANCH
              value: {{ .branch | default "main" | quote }}
            - name: STORE_GIT_PATH
              value: {{ .path | quote }}
            - name: STORE_NAMESPACE
              value: {{ .namespace | quote }}
            - name: STORE_AUTHOR_DOMAIN
              value: {{ .authorDomain | default "platform.local" | quote }}
            - name: STORE_GIT_USERNAME
              value: {{ .username | quote }}
            {{- if .existingSecret }}
            - name: STORE_GIT_SECRET_DIR
              value: /etc/platform-store
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.backend.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.backend.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: store-work
              mountPath: /var/lib/platform-store
            {{- if and .Values.backend.store.git.url .Values.backend.store.git.existingSecret }}
            - name: store-secret
              mountPath: /etc/platform-store
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      volumes:
        - name: store-work
          emptyDir: {}
        {{- if and .Values.backend.store.git.url .Values.backend.store.git.existingSecret }}
        - name: store-secret
          secret:
            secretName: {{ .Values.backend.store.git.existingSecret }}
            # Read by the backend's own user (1000); the pod runs nothing else.
            defaultMode: 0444
        {{- end }}
