{{- if .Values.runner.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudwatch-insights.runner.fullname" . }}
  labels:
    {{- include "cloudwatch-insights.runner.selectorLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.runner.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "cloudwatch-insights.runner.selectorLabels" . | nindent 4 }}
{{- end }}
