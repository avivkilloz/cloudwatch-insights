{{- if .Values.agent.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudwatch-insights.agent.fullname" . }}
  labels:
    {{- include "cloudwatch-insights.agent.selectorLabels" . | nindent 4 }}
spec:
  type: {{ .Values.agent.service.type }}
  ports:
    - port: {{ .Values.agent.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "cloudwatch-insights.agent.selectorLabels" . | nindent 4 }}
{{- end }}
