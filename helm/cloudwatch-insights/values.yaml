nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

# ServiceAccount used by the BACKEND pod only (the frontend is static nginx
# and never touches AWS). This is what IRSA binds to: annotate it with the
# ARN of the "hub" IAM role the backend should run as, which must itself be
# allowed to sts:AssumeRole into the CloudWatchInsightsReadRole (or whatever
# you name it) role that exists in every target account. See the chart
# README for the full IRSA + per-account trust policy walkthrough.
serviceAccount:
  create: true
  name: ""
  annotations: {}
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::<HUB_ACCOUNT_ID>:role/cloudwatch-insights-hub-role

backend:
  image:
    repository: ghcr.io/avivkilloz/cloudwatch-insights-backend
    tag: latest
    pullPolicy: IfNotPresent

  replicaCount: 2

  service:
    type: ClusterIP
    port: 8000

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # AWS_REGION is only used by boto3's STS client for its own endpoint;
  # it does not restrict which regions you can query.
  awsRegion: us-east-1

  # Postgres connection for the app's own storage (accounts, settings,
  # saved queries). Bring your own Postgres -- this chart does not deploy
  # one. Two ways to configure it:
  #
  # Option A (recommended): point at an existing Secret holding a full
  # SQLAlchemy DATABASE_URL, e.g.
  #   postgresql+psycopg2://user:password@host:5432/dbname?sslmode=require
  #
  #   database:
  #     existingSecret: cloudwatch-insights-db
  #     existingSecretKey: DATABASE_URL
  #
  # Option B: discrete fields, with the password pulled from a Secret (or,
  # for quick testing only, given inline via `password`).
  #
  #   database:
  #     host: my-postgres.example.internal
  #     port: 5432
  #     name: cloudwatch_insights
  #     user: cloudwatch_insights
  #     sslMode: require
  #     passwordSecret:
  #       name: cloudwatch-insights-db
  #       key: password
  database:
    existingSecret: ""
    existingSecretKey: DATABASE_URL

    host: ""
    port: 5432
    name: cloudwatch_insights
    user: cloudwatch_insights
    sslMode: ""
    passwordSecret:
      name: ""
      key: password
    # Inline password, only used when passwordSecret.name is empty. Prefer
    # passwordSecret (or existingSecret) so the password isn't stored in
    # this values file / the release's plain-text values history.
    password: ""

  # AI assistant (build-a-query and ask-about-results, on the Logs page).
  # Optional -- when baseUrl is empty the feature stays hidden in the UI, and
  # no LITELLM_* env vars are set at all. Backed by a LiteLLM proxy (or
  # anything else exposing an OpenAI-compatible /chat/completions endpoint),
  # so this works the same regardless of which model provider you actually
  # run behind it. Two ways to supply the API key, same shape as `database`
  # above:
  #
  # Option A: an existing Secret.
  #   ai:
  #     baseUrl: https://litellm.example.com
  #     model: gpt-4o-mini
  #     existingSecret: cloudwatch-insights-litellm
  #     existingSecretKey: LITELLM_API_KEY
  #
  # Option B (quick testing only): inline apiKey, stored in this values file
  # / the release's plain-text values history.
  ai:
    baseUrl: ""
    model: ""
    existingSecret: ""
    existingSecretKey: LITELLM_API_KEY
    apiKey: ""

  # Initial admin user, created once on first startup (when no users exist
  # yet). If left empty, the backend generates a random password itself and
  # logs it once to the pod's startup logs -- fine for a quick try-out, but
  # set this explicitly for any real deployment so the password doesn't only
  # ever live in a log line. Same two-way shape as `database`/`ai` above:
  #
  # Option A: an existing Secret.
  #   auth:
  #     existingSecret: cloudwatch-insights-admin
  #     existingSecretKey: ADMIN_PASSWORD
  #
  # Option B (quick testing only): inline password, stored in this values
  # file / the release's plain-text values history.
  auth:
    existingSecret: ""
    existingSecretKey: ADMIN_PASSWORD
    adminPassword: ""
    # Set to false only for local/HTTP-only deployments -- it controls the
    # session cookie's `Secure` flag, which browsers require HTTPS for.
    cookieSecure: true

  # Extra environment variables merged into the backend container, e.g. to
  # tune retries or point at a proxy.
  extraEnv: []
  # extraEnv:
  #   - name: AWS_RETRY_MODE
  #     value: adaptive

  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000

  livenessProbe:
    httpGet:
      path: /api/health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 15
  readinessProbe:
    httpGet:
      path: /api/health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10

frontend:
  image:
    repository: ghcr.io/avivkilloz/cloudwatch-insights-frontend
    tag: latest
    pullPolicy: IfNotPresent

  replicaCount: 2

  service:
    type: ClusterIP
    port: 8080

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

  podAnnotations: {}

  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 5
    periodSeconds: 15
  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10

ingress:
  enabled: false
  className: ""
  annotations: {}
  # annotations:
  #   cert-manager.io/cluster-issuer: letsencrypt-prod
  host: cloudwatch-insights.example.com
  tls: []
  # tls:
  #   - secretName: cloudwatch-insights-tls
  #     hosts:
  #       - cloudwatch-insights.example.com
