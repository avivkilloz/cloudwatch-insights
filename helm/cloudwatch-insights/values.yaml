nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

# ServiceAccount used by the BACKEND pod only (the frontend is static nginx
# and never touches AWS). This is what IRSA binds to: annotate it with the
# ARN of the "hub" IAM role the backend should run as, which must itself be
# allowed to sts:AssumeRole into the CloudWatchInsightsReadRole (or whatever
# you name it) role that exists in every target account. See the chart
# README for the full IRSA + per-account trust policy walkthrough.
serviceAccount:
  create: true
  name: ""
  annotations: {}
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::<HUB_ACCOUNT_ID>:role/cloudwatch-insights-hub-role

backend:
  image:
    repository: ghcr.io/avivkilloz/cloudwatch-insights-backend
    tag: latest
    pullPolicy: IfNotPresent

  replicaCount: 2

  service:
    type: ClusterIP
    port: 8000

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # AWS_REGION is only used by boto3's STS client for its own endpoint;
  # it does not restrict which regions you can query.
  awsRegion: us-east-1

  # Postgres connection for the app's own storage (accounts, settings,
  # saved queries). Bring your own Postgres -- this chart does not deploy
  # one. Two ways to configure it:
  #
  # Option A (recommended): point at an existing Secret holding a full
  # SQLAlchemy DATABASE_URL, e.g.
  #   postgresql+psycopg2://user:password@host:5432/dbname?sslmode=require
  #
  #   database:
  #     existingSecret: cloudwatch-insights-db
  #     existingSecretKey: DATABASE_URL
  #
  # Option B: discrete fields, with the password pulled from a Secret (or,
  # for quick testing only, given inline via `password`).
  #
  #   database:
  #     host: my-postgres.example.internal
  #     port: 5432
  #     name: cloudwatch_insights
  #     user: cloudwatch_insights
  #     sslMode: require
  #     passwordSecret:
  #       name: cloudwatch-insights-db
  #       key: password
  database:
    existingSecret: ""
    existingSecretKey: DATABASE_URL

    host: ""
    port: 5432
    name: cloudwatch_insights
    user: cloudwatch_insights
    sslMode: ""
    passwordSecret:
      name: ""
      key: password
    # Inline password, only used when passwordSecret.name is empty. Prefer
    # passwordSecret (or existingSecret) so the password isn't stored in
    # this values file / the release's plain-text values history.
    password: ""

  # The model the platform agent (`agent` below) calls: a LiteLLM proxy, or
  # anything else exposing an OpenAI-compatible /chat/completions endpoint,
  # so this works the same whichever provider actually runs behind it. It
  # lives under `backend` for compatibility with values files written when
  # the backend's own ✦ assistant used it; the agent replaced that assistant,
  # and only the agent reads these now. Needed only with `agent.enabled`.
  # Two ways to supply the API key, same shape as `database` above:
  #
  # Option A: an existing Secret.
  #   ai:
  #     baseUrl: https://litellm.example.com
  #     model: gpt-4o-mini
  #     existingSecret: cloudwatch-insights-litellm
  #     existingSecretKey: LITELLM_API_KEY
  #
  # Option B (quick testing only): inline apiKey, stored in this values file
  # / the release's plain-text values history.
  ai:
    baseUrl: ""
    model: ""
    existingSecret: ""
    existingSecretKey: LITELLM_API_KEY
    apiKey: ""

  # Initial admin user, created once on first startup (when no users exist
  # yet). If left empty, the backend generates a random password itself and
  # logs it once to the pod's startup logs -- fine for a quick try-out, but
  # set this explicitly for any real deployment so the password doesn't only
  # ever live in a log line. Same two-way shape as `database`/`ai` above:
  #
  # Option A: an existing Secret.
  #   auth:
  #     existingSecret: cloudwatch-insights-admin
  #     existingSecretKey: ADMIN_PASSWORD
  #
  # Option B (quick testing only): inline password, stored in this values
  # file / the release's plain-text values history.
  auth:
    existingSecret: ""
    existingSecretKey: ADMIN_PASSWORD
    adminPassword: ""
    # Set to false only for local/HTTP-only deployments -- it controls the
    # session cookie's `Secure` flag, which browsers require HTTPS for.
    cookieSecure: true

  # The master key that encrypts stored credentials (Settings -> Credentials).
  # Without it, credentials are off and the rest of the platform works as
  # before. It always comes from an existing Secret -- there is deliberately
  # no inline option and the chart never generates one: under Argo CD the
  # chart is rendered without cluster access, so a generated key would be
  # replaced on every sync and every stored credential would become
  # unreadable. See DEPLOYMENT.md, "Credentials: the master key" (creating,
  # backing up and rotating it).
  #
  #   kubectl create secret generic cloudwatch-insights-master-key \
  #     --from-literal=PLATFORM_MASTER_KEYS="k1:$(openssl rand -base64 32)"
  #   masterKey:
  #     existingSecret: cloudwatch-insights-master-key
  #     keyId: k1
  masterKey:
    existingSecret: ""
    existingSecretKey: PLATFORM_MASTER_KEYS
    # The key in the keyring that new secrets are written with. Empty uses
    # the first one; set it when the keyring holds more than one (rotation).
    keyId: ""

  # The store repo (PLATFORM_PLAN.md §21): the git repo the credential and
  # connection types (and, later, workflows and panes) made in the platform
  # are written to, in a plugin repo's layout, so they outlive the database.
  # Set here, a new cluster restores them on its first start; left empty, an
  # admin can set one in Settings -> Store instead. Never credential values,
  # connections, users or sessions -- those stay in Postgres (back it up).
  #
  #   kubectl create secret generic cloudwatch-insights-store \
  #     --from-literal=token=<a token that can push to the repo>
  #   # or: --from-file=ssh-privatekey=./id_ed25519 --from-file=known_hosts=./known_hosts
  #   store:
  #     git:
  #       url: https://github.com/acme/platform-store.git
  #       namespace: devops
  #       existingSecret: cloudwatch-insights-store
  store:
    git:
      url: ""
      branch: main
      # A folder in the repo; empty is its root.
      path: ""
      # What's made here is named <namespace>:<name>, and the repo is the
      # plugin of that id. Required with a url.
      namespace: ""
      # Commits are by whoever saved, as <username>@<authorDomain>.
      authorDomain: platform.local
      # For a token: the username sent with it (x-access-token suits GitHub,
      # oauth2 GitLab).
      username: ""
      # A Secret with `token`, or `ssh-privatekey` (and optionally
      # `known_hosts`, else the host's first key is trusted).
      existingSecret: ""

  # Packages for code (PLATFORM_PLAN.md §25, D141-D143): a definition's
  # requirements.txt is locked against this index, and the runner installs
  # the lock's wheels through the backend, which fetches them from here once
  # (checked against the lock's hashes) and keeps them. Empty: PyPI. The
  # backend must reach it; the runner never does.
  #   deps:
  #     indexUrl: https://nexus.acme.internal/repository/pypi/simple
  deps:
    indexUrl: ""
    # The Python the runner runs code with: locks are made for it.
    pythonVersion: "3.12"
    # Room for kept wheels (an emptyDir: refetched after a restart); the
    # least recently served go past 1500 MiB (DEPS_WHEELS_MB).
    cacheSize: 2Gi

  # The blob store (PLATFORM_PLAN.md §8.2, D91): files too big for a row --
  # a workflow step's whole outputs, a run's artifacts. Postgres keeps only
  # their metadata, and every download goes through the backend's own check.
  #
  # Every replica must reach the same store. With more than one replica,
  # use s3, or filesystem on a ReadWriteMany volume (EFS, Filestore, NFS):
  # the chart refuses a ReadWriteOnce claim with several replicas, and an
  # emptyDir (persistence off) holds each pod's files apart -- a download
  # served by another replica then finds nothing.
  #
  #   storage:
  #     type: s3
  #     s3:
  #       bucket: my-platform-files
  #       region: eu-west-1
  storage:
    # s3 (recommended) | filesystem
    type: filesystem
    # How long a run's files are kept.
    retentionDays: 90
    s3:
      bucket: ""
      region: ""
      # Empty for AWS; set for any S3-compatible server (MinIO, Ceph...).
      endpoint: ""
      # A folder in the bucket; empty is its root.
      prefix: ""
      # Written as the platform's own AWS identity: the service account's
      # IRSA role needs s3:PutObject, GetObject and DeleteObject on it.
    filesystem:
      path: /data/files
      persistence:
        # Off: an emptyDir, gone with the pod -- for one replica, trying it out.
        enabled: false
        # Use a claim you made yourself, else the chart makes one.
        existingClaim: ""
        storageClass: ""
        # ReadWriteMany for more than one replica.
        accessMode: ReadWriteMany
        size: 50Gi

  # Extra environment variables merged into the backend container, e.g. to
  # tune retries or point at a proxy.
  extraEnv: []
  # extraEnv:
  #   - name: AWS_RETRY_MODE
  #     value: adaptive

  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000

  livenessProbe:
    httpGet:
      path: /api/health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 15
  readinessProbe:
    httpGet:
      path: /api/health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10

# The platform agent (platform-agent/ in the repo): a separate Deployment,
# reachable only inside the cluster, that the backend relays chat turns to.
# It acts as the user who asks, through the backend's MCP endpoint (/mcp) and a
# short-lived per-turn token, so it can do exactly what that user's group can
# and no more -- and a group only gets it once an admin turns "Platform agent"
# on for that group in Settings. Off by default.
#
# It uses the LiteLLM proxy and API key in `backend.ai` (which must be set),
# with its own model if you give one here: it needs one good at tool calling.
agent:
  enabled: false
  image:
    repository: ghcr.io/avivkilloz/cloudwatch-insights-agent
    tag: latest
    pullPolicy: IfNotPresent

  # Turns are stateless on the agent's side (the conversation comes with each
  # one), so any number of replicas works.
  replicaCount: 1

  service:
    type: ClusterIP
    port: 8100

  # The model behind backend.ai.baseUrl to use; empty means backend.ai.model.
  model: ""
  # A turn's ceiling on model-and-tool steps.
  maxSteps: 40
  # Sampling temperature; empty leaves it to the model's own default. Don't
  # set 0 for a reasoning model (one that thinks in <think> tags): greedy
  # decoding makes those repeat themselves until they run out of tokens --
  # use what the model's card recommends (often 0.6).
  temperature: ""
  # A ceiling on one model step's output, in tokens; empty for the model's own.
  maxTokens: ""
  # Every answer is checked against what the turn actually ran -- its tool
  # calls and the sessions afterwards -- by one more model call; an answer
  # that claims what nothing did is redone once (PLATFORM_PLAN.md D55).
  # About one extra call per answer. `model` empty means agent.model.
  check:
    enabled: true
    model: ""

  # The Builder's agent (PLATFORM_PLAN.md D116): a turn beside the Builder's
  # or a workflow's editor. `loop` runs it as a loop the code drives -- plan,
  # read the AWS operations and examples it names, change the draft by path,
  # check, send any problem back (up to `rounds` times), put it in the editor
  # -- with the model asked only for one JSON object at a time; `agent` is the
  # chat agent with build tools, as before. Building is where a stronger model
  # pays for itself: `model` empty means agent.model. `maxTokens` caps one
  # reply (a whole set of changes); empty for the model's own.
  builder:
    mode: loop
    model: ""
    temperature: ""
    maxTokens: ""
    rounds: 6
    # Run it as a Deployment of its own (the same image): build turns go
    # there, so a long build never shares a pod with chat turns, and its
    # replicas and resources are its own (`resources` empty: agent.resources).
    deployment:
      enabled: false
      replicaCount: 1
      resources: {}

  # Optional: a key shared by the backend and the agent, so nothing else in
  # the cluster can call the agent (and spend the model's budget). An existing
  # Secret, so it stays the same across upgrades and ArgoCD syncs:
  #   kubectl create secret generic cloudwatch-insights-agent \
  #     --from-literal=AGENT_SERVICE_KEY="$(openssl rand -hex 32)"
  serviceKey:
    existingSecret: ""
    existingSecretKey: AGENT_SERVICE_KEY

  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 512Mi

  extraEnv: []
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000

  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 15
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10

# The runner (runner/ in the repo, PLATFORM_PLAN.md §25): where code written in
# the Builder runs -- a pane's action or a step that's `code:`. It holds
# nothing: a job's only way out is a call back to the backend, made there as
# the user running the code (their identity, the SSRF guard, the reply
# masked). Without it, code is checked and saved but doesn't run. Off by
# default.
runner:
  enabled: false
  image:
    repository: ghcr.io/avivkilloz/cloudwatch-insights-runner
    tag: latest
    pullPolicy: IfNotPresent

  # Jobs hold no state between them, so any number of replicas works.
  replicaCount: 1

  service:
    port: 8200

  # The key the backend starts jobs with: an existing Secret, so it stays the
  # same across upgrades and ArgoCD syncs.
  #   kubectl create secret generic cloudwatch-insights-runner \
  #     --from-literal=RUNNER_TOKEN="$(openssl rand -hex 32)"
  token:
    existingSecret: ""
    existingSecretKey: RUNNER_TOKEN

  # Jobs at once per pod (each its own uid), and each one's memory.
  concurrency: 4
  jobMemoryMb: 512
  # Room for jobs' files (each may write 16 MiB).
  tmpSize: 256Mi
  # Venvs for code with requirements (D144): one per lock, shared, kept until
  # the least recently used go past sizeMb (their emptyDir is a little larger,
  # for the one being built).
  venvs:
    sizeMb: 2000

  # Its pods may reach the backend and DNS only. `dnsLabels` select the
  # cluster's DNS pods (kube-dns / CoreDNS on most clusters).
  networkPolicy:
    enabled: true
    dnsLabels:
      k8s-app: kube-dns

  # Root without the capabilities root usually has: what dropping to a slot's
  # uid needs (SETUID, SETGID), giving it its home (CHOWN) and stopping a job
  # past its time (KILL). Leave it so; the jobs never run as root.
  securityContext:
    runAsUser: 0
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
      add: [SETUID, SETGID, CHOWN, KILL]
    seccompProfile:
      type: RuntimeDefault

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 2560Mi

  podAnnotations: {}

  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 15
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10

frontend:
  image:
    repository: ghcr.io/avivkilloz/cloudwatch-insights-frontend
    tag: latest
    pullPolicy: IfNotPresent

  replicaCount: 2

  service:
    type: ClusterIP
    port: 8080

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

  podAnnotations: {}

  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 5
    periodSeconds: 15
  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10

ingress:
  enabled: false
  className: ""
  annotations: {}
  # annotations:
  #   cert-manager.io/cluster-issuer: letsencrypt-prod
  host: cloudwatch-insights.example.com
  tls: []
  # tls:
  #   - secretName: cloudwatch-insights-tls
  #     hosts:
  #       - cloudwatch-insights.example.com
